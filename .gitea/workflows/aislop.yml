name: aislop
# Quality gate for AI-generated slop patterns (https://github.com/scanaislop/aislop).
# `aislop ci` scores the whole repo (0-100) and exits non-zero when the score
# drops below ci.failBelow (100) in .aislop/config.yml - gating the PR/push.
#
# Runs on Windows (not Linux like test.yml's other jobs): MFTLib.sln includes the
# native MFTLibNative.vcxproj, which only loads/builds under MSBuild + MSVC, and
# both jb inspectcode and roslynator load the full solution. lint.csharp.jbProjects
# in .aislop/config.yml scopes jb inspection to the five C# projects so the C++
# tree stays on its own clang-tidy/cppcheck gate.
#
# The C# engine lives ONLY in the personal fork gitea.fleet.sticktoitive.net/
# schoen/aislop (the public npm `aislop` scores just the Python ci/ tooling),
# so we clone + build that fork at the commit pinned in .aislop/fork-commit
# and run the built CLI. Gitea is the canonical source - the pin is bumped by
# pushes that land there first - and github.com/mtschoen/aislop is a mirror
# that can lag behind, so a freshly bumped sha may not exist on GitHub yet.
# The pin is bumped by the aislop fork's sync-consumers workflow via PR; a
# manual bump = edit .aislop/fork-commit.
on:
  pull_request:
  push:
    # pr-crew merge train pushes its synthetic batch commit to this branch and polls this run's statuses before landing the batch.
    branches: [main, 'pr-crew/merge-train/**']
  workflow_dispatch:

# A newer commit on a pull request supersedes the run in flight. Never cancel a
# push to main or a merge-train branch: those runs gate the landing batch.
concurrency:
  group: aislop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node ignores the Windows cert store, so staged mkcert CA on the runner preserves
  # TLS verification for internal HTTPS fetches when present (local-ci #33).
  # Harmless now that Gitea serves a Let's Encrypt cert (Node falls back to its
  # bundle if the file is missing).
  NODE_EXTRA_CA_CERTS: C:\actions-runner\mkcert-ca.pem

jobs:
  quality-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read aislop fork pin
        # Pinned by commit, not a published version - the registry publish
        # route is retired. The pin is bumped by the aislop fork's
        # sync-consumers workflow via PR; a manual bump = edit
        # .aislop/fork-commit directly. .aislop/fork-commit is modified by
        # external bump PRs by design, so validate it is exactly one 40-char
        # lowercase hex sha before it reaches GITHUB_ENV - an unvalidated
        # write would let a crafted file with embedded newlines inject
        # arbitrary env vars into later steps.
        shell: pwsh
        run: |
          $commit = (Get-Content .aislop/fork-commit -Raw).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$') {
            Write-Error "ERROR: .aislop/fork-commit is not a single 40-char lowercase sha"
            exit 1
          }
          "AISLOP_FORK_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # No actions/setup-node: on host-mode act_runner its 7zr.exe Node extraction
      # dies with exit code 2 (actions/setup-node#1147, "Trap 1" in local-ci
      # project-ci-setup.md). The Windows runner host has Node LTS on the machine
      # PATH; npx uses it directly. That node must satisfy tsdown's build floor
      # (node ^22.18 || >=24.11), because `pnpm install` builds the fork via its
      # "prepare": "tsdown" script; below that, tsdown dies on
      # Promise.withResolvers. Not aislop's runtime floor, which is still node 18.

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # roslynator and jb come from the runner at the fleet manifest pins. The
      # shared dotnet tools directory is already on PATH.
      - name: Build MFTLib (native + managed; jb/roslynator load it)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/scripts/build-windows.ps1" -Configuration Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Restore the built aislop fork
        id: aislop-cache
        uses: actions/cache@v4
        with:
          # Keyed on the pinned sha, which is immutable, so a hit is always the
          # build for exactly this pin and the clone + install below is skipped.
          # The key is a literal sha, never hashFiles() (project-ci-setup.md:
          # hashFiles can evaluate empty on act_runner and freeze the cache).
          # A workspace-relative path (../aislop) is stable across jobs on this
          # host-mode runner, whereas runner.temp contains a random per-job path
          # that changes the cache version hash and prevents cache hits.
          path: ../aislop
          key: aislop-fork-${{ env.AISLOP_FORK_COMMIT }}

      - name: Repair restored aislop dependency links
        if: steps.aislop-cache.outputs.cache-hit == 'true'
        # pnpm links dependencies on Windows with junctions whose targets are
        # ABSOLUTE paths into the producing job's directory. Gitea act gives
        # every job a fresh random hostexecutor directory that is deleted at
        # job cleanup, and actions/cache restores the archived links verbatim,
        # so a cache hit leaves every junction pointing into the deleted
        # producing job and node dies with MODULE_NOT_FOUND. Junctions cannot
        # be relative, so re-point each restored link at the same path suffix
        # inside this job's tree before the CLI runs. A link whose absolute
        # target still resolves outside the tree is left alone; one that maps
        # nowhere fails the step instead of running a broken gate. Verified
        # with the same tar invocation actions/cache uses (GNU tar --posix -P
        # with MSYS=winsymlinks:nativestrict): restore in a fresh directory
        # reproduces MODULE_NOT_FOUND, and after this repair the CLI runs and
        # its unbundled runtime deps (typescript, web-tree-sitter) resolve.
        shell: pwsh
        run: |
          $aislopDir = (Resolve-Path "$env:GITHUB_WORKSPACE\..\aislop").Path
          $links = [System.Collections.Generic.List[string]]::new()
          $stack = [System.Collections.Generic.Stack[string]]::new([string[]]@($aislopDir))
          while ($stack.Count -gt 0) {
            $dir = $stack.Pop()
            foreach ($entry in [System.IO.Directory]::EnumerateFileSystemEntries($dir)) {
              $attrs = [System.IO.File]::GetAttributes($entry)
              if (($attrs -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                $links.Add($entry)
              } elseif (($attrs -band [System.IO.FileAttributes]::Directory) -ne 0) {
                $stack.Push($entry)
              }
            }
          }
          $retargeted = 0
          $unrepairable = [System.Collections.Generic.List[string]]::new()
          foreach ($entry in $links) {
            $target = (Get-Item -LiteralPath $entry -Force).LinkTarget
            if ([string]::IsNullOrEmpty($target)) { continue }
            $normalized = $target -replace '^\\\\\?\\', '' -replace '^\\\?\?\\', ''
            if (-not [System.IO.Path]::IsPathRooted($normalized)) { continue }
            $components = $normalized.Split('\', [StringSplitOptions]::RemoveEmptyEntries)
            $candidate = $null
            for ($i = 1; $i -lt $components.Count; $i++) {
              $candidatePath = Join-Path $aislopDir ([string]::Join('\', $components, $i, $components.Count - $i))
              if (Test-Path -LiteralPath $candidatePath) { $candidate = $candidatePath; break }
            }
            if ($null -eq $candidate) {
              if (Test-Path -LiteralPath $normalized) { continue }
              $unrepairable.Add("$entry -> $target")
              continue
            }
            if ($candidate -ieq $normalized) { continue }
            $isDir = ([System.IO.File]::GetAttributes($entry) -band [System.IO.FileAttributes]::Directory) -ne 0
            if ($isDir) {
              [System.IO.Directory]::Delete($entry)
              New-Item -ItemType Junction -Path $entry -Target $candidate | Out-Null
            } else {
              [System.IO.File]::Delete($entry)
              New-Item -ItemType SymbolicLink -Path $entry -Target $candidate | Out-Null
            }
            $retargeted++
          }
          Write-Host "Repaired $retargeted of $($links.Count) restored dependency links"
          if ($unrepairable.Count -gt 0) {
            $unrepairable | ForEach-Object { Write-Host "UNREPAIRABLE: $_" }
            Write-Error "Restored aislop tree has dependency links that do not map into this job's tree"
            exit 1
          }
          & node "$aislopDir\dist\cli.js" --version
          if ($LASTEXITCODE -ne 0) { Write-Error "restored aislop CLI failed to start after link repair"; exit 1 }

      - name: Build C#-capable aislop (pinned fork commit)
        if: steps.aislop-cache.outputs.cache-hit != 'true'
        # Cloned outside the workspace so aislop does not scan the fork's own source.
        # From Gitea (canonical, always current), not the github.com mirror (can lag
        # behind by many commits, so a freshly bumped pin can be absent there).
        # The fork is a pnpm workspace (packageManager pnpm@10.28.0 + pnpm-lock.yaml);
        # npm chokes on it on some npm versions, so install via pnpm through npx -y
        # (hermetic - no corepack or preinstalled pnpm needed).
        shell: pwsh
        run: |
          $aislopDir = "$env:GITHUB_WORKSPACE\..\aislop"
          if (Test-Path $aislopDir) { Remove-Item -Recurse -Force $aislopDir }
          git clone https://gitea.fleet.sticktoitive.net/schoen/aislop.git $aislopDir
          if ($LASTEXITCODE -ne 0) { Write-Error "git clone failed"; exit 1 }
          git -C $aislopDir checkout "$env:AISLOP_FORK_COMMIT"
          if ($LASTEXITCODE -ne 0) { Write-Error "git checkout failed"; exit 1 }
          Push-Location $aislopDir
          npx -y pnpm@10.28.0 install --frozen-lockfile
          $installExit = $LASTEXITCODE
          Pop-Location
          if ($installExit -ne 0) { Write-Error "pnpm install failed"; exit 1 }

      - name: aislop quality gate
        # Sanity-fail if the C# engine did not actually analyze the .cs tree (avoid a
        # silent Python-only pass): require a healthy file count alongside the score gate.
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $report = "$env:RUNNER_TEMP\aislop-report.json"
          # The scan's stdout goes to $report, so the step would otherwise stay silent
          # for the scan's whole duration - and Gitea's zombie-task reaper
          # (ZOMBIE_TASK_TIMEOUT, 10 minutes) fails any task whose log is quiet that
          # long, which a busy runner can trigger. Run the scan detached and heartbeat
          # from the foreground so the task log stays alive.
          $cli = "$env:GITHUB_WORKSPACE\..\aislop\dist\cli.js"
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "node `"$cli`" ci . --json > `"$report`"" -NoNewWindow -PassThru
          $null = $process.Handle
          $lastBeat = [DateTime]::UtcNow
          while (-not $process.HasExited) {
              Start-Sleep -Seconds 5
              if (([DateTime]::UtcNow - $lastBeat).TotalSeconds -ge 60) {
                  Write-Host "aislop scan in progress ($([DateTime]::UtcNow.ToString('HH:mm:ss')))"
                  $lastBeat = [DateTime]::UtcNow
              }
          }
          $gateExit = $process.ExitCode
          $result = Get-Content $report -Raw | ConvertFrom-Json
          $files = if ($result.summary.files) { $result.summary.files } else { 0 }
          Write-Host "aislop score $($result.score) over $files files"
          if ($files -lt 10) { Write-Error "aislop only scanned $files files - the C# engine did not run"; exit 1 }
          if ($gateExit -ne 0) {
              $diagnostics = if ($result.diagnostics) { @($result.diagnostics) } else { @() }
              $scoring = @($diagnostics | Where-Object { $_.scoreImpact.multiplier -gt 0 })
              $reportOnly = $diagnostics.Count - $scoring.Count
              if ($scoring.Count -eq 0) {
                  Write-Host "aislop score below failBelow, but no score-affecting findings were reported ($reportOnly report-only findings not shown)"
              } else {
                  Write-Host "::group::aislop score-affecting findings ($($scoring.Count); $reportOnly report-only findings not shown)"
                  foreach ($d in $scoring) {
                      Write-Host ("[{0}/{1}] {2}" -f $d.engine, $d.severity, $d.rule)
                      Write-Host ("    {0}:{1}  {2}" -f $d.filePath, $d.line, $d.message)
                  }
                  Write-Host "::endgroup::"
              }
              Write-Error "aislop score below failBelow"
              exit 1
          }
