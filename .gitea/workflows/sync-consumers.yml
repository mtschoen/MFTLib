# .gitea/workflows/sync-consumers.yml
name: sync-consumers
# Keeps every consumer repo's MFTLib pin in sync with main.
# Convention: a consumer repo pins MFTLib with a git submodule whose url
# resolves to this repository, declared in .gitmodules on its default branch.
# Both consumers declare it at external/MFTLib with the relative url
# ../MFTLib.git. The submodule gitlink is the pin, so this workflow bumps that
# gitlink across every consumer on every push to main. A run that matches no
# consumer fails rather than reporting success: a green fan-out that updated
# nothing hides pin drift.
#
# Required one-time setup: create a Gitea Actions secret named
# MFTLIB_SYNC_TOKEN on this repository, holding a personal access token for
# the claude-code bot (scopes: write:repository, read:repository), and add
# claude-code as a write collaborator on every consumer repository this
# workflow is meant to update. This workflow does not and cannot create
# that secret or that collaborator grant itself.
#
# Gitea only, never github.com: the push that triggers this workflow lands
# on Gitea. The GitHub mirror can lag behind it, so every clone and fetch
# targets gitea.fleet.sticktoitive.net.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-consumers-${{ github.ref }}

permissions:
  contents: read

jobs:
  fan-out:
    name: Bump consumer repo pins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Run before the fan-out, not only in the test workflow: this job holds
      # the write token and pushes branches into other repositories, so a
      # broken detection or bump path must not get that far.
      - name: Test the sync script
        run: bash scripts/sync_consumers.tests.sh

      - name: Sync consumer repos to the new MFTLib pin
        env:
          GITEA_TOKEN: ${{ secrets.MFTLIB_SYNC_TOKEN }}
        run: |
          bash scripts/sync_consumers.sh "${{ github.sha }}"
