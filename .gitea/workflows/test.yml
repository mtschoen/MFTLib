# .gitea/workflows/test.yml
name: test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pin-only PRs (a bump of .aislop/fork-commit, opened by the aislop fork's
      # sync-consumers workflow) don't touch anything this job builds or tests.
      # Detect that case and skip the rest of the job's steps (still SUCCESS,
      # not skipped-as-failure, so branch protection's required check is
      # satisfied) instead of paying for a full build+test cycle. Never use
      # workflow-level paths/paths-ignore for this: on Gitea that leaves the
      # required check permanently pending for any PR that doesn't touch the
      # matched paths (gitea issue 36895).
      - name: Determine changed files (pin-only PR early exit)
        id: changed-files
        shell: pwsh
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          $pinOnly = $false
          try {
            if ($env:GITHUB_EVENT_NAME -eq "pull_request" -and $env:GITHUB_BASE_REF) {
              git fetch --depth=1 origin $env:GITHUB_BASE_REF 2>$null
              if ($LASTEXITCODE -eq 0) {
                $changed = @(git diff --name-only FETCH_HEAD HEAD 2>$null)
                Write-Host "Changed files vs $($env:GITHUB_BASE_REF):"
                $changed | ForEach-Object { Write-Host $_ }
                if ($changed.Count -eq 1 -and $changed[0] -eq ".aislop/fork-commit") {
                  $pinOnly = $true
                }
              }
            } elseif ($env:GITHUB_EVENT_NAME -eq "push" -and $env:EVENT_BEFORE -and $env:EVENT_BEFORE -ne "0000000000000000000000000000000000000000") {
              git fetch --depth=1 origin $env:EVENT_BEFORE 2>$null
              if ($LASTEXITCODE -eq 0) {
                $changed = @(git diff --name-only $env:EVENT_BEFORE $env:EVENT_AFTER 2>$null)
                Write-Host "Changed files ($($env:EVENT_BEFORE)..$($env:EVENT_AFTER)):"
                $changed | ForEach-Object { Write-Host $_ }
                if ($changed.Count -eq 1 -and $changed[0] -eq ".aislop/fork-commit") {
                  $pinOnly = $true
                }
              }
            }
          } catch {
            Write-Host "Changed-file detection failed, running the job in full: $_"
            $pinOnly = $false
          }
          "pin_only=$($pinOnly.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup .NET 10 SDK
        if: steps.changed-files.outputs.pin_only != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        if: steps.changed-files.outputs.pin_only != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Install reportgenerator
        if: steps.changed-files.outputs.pin_only != 'true'
        shell: pwsh
        run: |
          dotnet tool update --global dotnet-reportgenerator-globaltool
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Run coverage
        if: steps.changed-files.outputs.pin_only != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: scripts\run-coverage.ps1 -NonInteractive

      - name: Upload coverage artifact
        if: always() && steps.changed-files.outputs.pin_only != 'true'
        uses: actions/upload-artifact@v3
        with:
          name: windows-coverage
          path: |
            MFTLib.Tests/coverage.xml
            MFTLib.Tests/coverage-report/**

      - name: Post coverage status
        if: always() && steps.changed-files.outputs.pin_only != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $summary = "MFTLib.Tests/coverage-report/Summary.txt"
          $pct = $null
          if (Test-Path $summary) {
            $match = Select-String -Path $summary -Pattern 'Line coverage:\s*([\d.]+)%' | Select-Object -First 1
            if ($match) { $pct = $match.Matches[0].Groups[1].Value }
          }
          if ($null -eq $pct) { $state = "error"; $desc = "coverage measurement failed" }
          else { $state = "success"; $desc = "$pct% line coverage" }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{ context = "pr-crew/coverage"; state = $state; description = $desc; target_url = $runUrl } | ConvertTo-Json -Compress
          curl.exe -s -X POST `
            -H "Authorization: token $env:GITHUB_TOKEN" `
            -H "Content-Type: application/json" `
            -d $body `
            "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"

      # Genuine, reproducible verification of the post-clean init standard
      # (AGENTS.md "Cleaning the working tree"): git clean -ffxd must be safe
      # to run, and init.ps1/init.bat must restore the checkout from that
      # state, twice (idempotency), through both entry points, including the
      # -Build path. Folded into this job rather than a separate one: it
      # reuses the .NET SDK, MSBuild, and warm NuGet cache already set up
      # above instead of paying for that setup twice, and it runs after the
      # job's own build+test have already passed, so the git clean below
      # only ever discards state this job no longer needs.
      - name: Verify git clean -ffxd leaves a clean tree
        if: steps.changed-files.outputs.pin_only != 'true'
        shell: pwsh
        run: |
          git clean -ffxd
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git clean -ffxd exited $LASTEXITCODE."
            exit 1
          }
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git status exited $LASTEXITCODE."
            exit 1
          }
          if ($status) {
            Write-Host "::error::git clean -ffxd left untracked/modified entries behind:"
            Write-Host $status
            exit 1
          }
          Write-Host "git clean -ffxd left a clean tree."

      - name: Run init.ps1 (post-clean restore, first run)
        if: steps.changed-files.outputs.pin_only != 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\init.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::init.ps1 (first run) exited $LASTEXITCODE."
            exit 1
          }
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git status exited $LASTEXITCODE."
            exit 1
          }
          if ($status) {
            Write-Host "::error::git status is dirty after init.ps1 (first run):"
            Write-Host $status
            exit 1
          }
          Write-Host "init.ps1 (first run) left a clean tree."

      - name: Run init.ps1 again (idempotency)
        if: steps.changed-files.outputs.pin_only != 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\init.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::init.ps1 (second run) exited $LASTEXITCODE."
            exit 1
          }
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git status exited $LASTEXITCODE."
            exit 1
          }
          if ($status) {
            Write-Host "::error::init.ps1 is not idempotent - git status is dirty after a second run:"
            Write-Host $status
            exit 1
          }
          Write-Host "init.ps1 is idempotent: git status is clean after a second run."

      - name: Run init.bat via cmd.exe (documented .\ prefix)
        if: steps.changed-files.outputs.pin_only != 'true'
        shell: cmd
        # NoDefaultCurrentDirectoryInExePath is a per-machine setting (AGENTS.md
        # documents it for the maintainer's own workstation), so this step
        # cannot reproduce the bare-`init.bat` failure that setting causes -
        # it verifies the documented, supported invocation (with the `.\`
        # prefix) actually works through cmd.exe, which is the load-bearing
        # claim: that init.bat correctly forwards to init.ps1.
        run: |
          .\init.bat
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Verify tree is clean after init.bat
        if: steps.changed-files.outputs.pin_only != 'true'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git status exited $LASTEXITCODE."
            exit 1
          }
          if ($status) {
            Write-Host "::error::git status is dirty after init.bat:"
            Write-Host $status
            exit 1
          }
          Write-Host "git status is clean after init.bat."

      - name: Run init.ps1 -Build (native + managed build path)
        if: steps.changed-files.outputs.pin_only != 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\init.ps1 -Build
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::init.ps1 -Build exited $LASTEXITCODE."
            exit 1
          }

      - name: Verify tree is clean after the full init path
        if: steps.changed-files.outputs.pin_only != 'true'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git status exited $LASTEXITCODE."
            exit 1
          }
          if ($status) {
            Write-Host "::error::git status is dirty after the full post-clean init verification:"
            Write-Host $status
            exit 1
          }
          Write-Host "git status is clean after the full post-clean init verification."

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pin-only PRs (a bump of .aislop/fork-commit, opened by the aislop fork's
      # sync-consumers workflow) don't touch anything this job builds or tests.
      # Detect that case and skip the rest of the job's steps (still SUCCESS,
      # not skipped-as-failure, so branch protection's required check is
      # satisfied) instead of paying for a full build+test cycle. Never use
      # workflow-level paths/paths-ignore for this: on Gitea that leaves the
      # required check permanently pending for any PR that doesn't touch the
      # matched paths (gitea issue 36895).
      - name: Determine changed files (pin-only PR early exit)
        id: changed-files
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          PIN_ONLY=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$GITHUB_BASE_REF" ]; then
            if git fetch --depth=1 origin "$GITHUB_BASE_REF" 2>/dev/null; then
              CHANGED=$(git diff --name-only FETCH_HEAD HEAD 2>/dev/null || true)
              echo "Changed files vs $GITHUB_BASE_REF:"
              echo "$CHANGED"
              if [ "$CHANGED" = ".aislop/fork-commit" ]; then
                PIN_ONLY=true
              fi
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch --depth=1 origin "$EVENT_BEFORE" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" 2>/dev/null || true)
              echo "Changed files ($EVENT_BEFORE..$EVENT_AFTER):"
              echo "$CHANGED"
              if [ "$CHANGED" = ".aislop/fork-commit" ]; then
                PIN_ONLY=true
              fi
            fi
          fi
          echo "pin_only=$PIN_ONLY" >> "$GITHUB_OUTPUT"

      - name: Install build deps
        if: steps.changed-files.outputs.pin_only != 'true'
        # gcovr from apt (universe) instead of pip: the runner's egress to
        # pypi.org goes through a TLS-intercepting proxy whose CA isn't in pip's
        # bundled certifi, so `pip install gcovr` fails cert verification. apt
        # uses the system trust store (which has the proxy CA) and works. Ubuntu
        # noble ships gcovr 7.x, which supports the value form of
        # --gcov-ignore-parse-errors that coverage-linux.sh relies on.
        run: |
          apt-get update
          apt-get install -y cmake ninja-build gcovr

      - name: Setup .NET 10 SDK
        if: steps.changed-files.outputs.pin_only != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run coverage
        if: steps.changed-files.outputs.pin_only != 'true'
        run: bash scripts/coverage-linux.sh

      - name: Upload coverage artifact
        if: always() && steps.changed-files.outputs.pin_only != 'true'
        uses: actions/upload-artifact@v3
        with:
          name: linux-coverage
          path: coverage-report/
