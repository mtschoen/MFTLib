# .gitea/workflows/test.yml
name: test
on:
  push:
    # pr-crew merge train pushes its synthetic batch commit to this branch and polls this run's statuses before landing the batch.
    branches: [main, 'pr-crew/merge-train/**']
  pull_request:
  schedule:
    # Scheduled runs skip every job while the repository variable NIGHTLY_CI is "off" (unset runs them).
    - cron: '23 5 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'

jobs:
  windows:
    if: vars.WINDOWS_CI != 'off' && (github.event_name != 'schedule' || vars.NIGHTLY_CI != 'off')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Parse every maintained script
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-script-syntax.ps1

      - name: Test script syntax gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/script-syntax.tests.ps1

      # Filter steps only on PRs. Workflow-level paths leave required checks
      # pending on Gitea (issue 36895). See docs/quality-gates.md for path scopes.
      - name: Determine changed files (docs-only or pin-only early exit)
        id: changed-files
        shell: pwsh
        run: |
          bash scripts/ci-changed-files.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSBuild
        if: steps.changed-files.outputs.skip_build != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Select runner-provisioned reportgenerator
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          if (-not $env:SCHOEN_LAB_TOOL_STORE_ROOT) { throw "Runner tool store is not configured" }
          $resolver = Join-Path $env:SCHOEN_LAB_TOOL_STORE_ROOT "resolver/use-tool.ps1"
          & pwsh -NoProfile -File $resolver reportgenerator --add-to-path
          if ($LASTEXITCODE -ne 0) { throw "ReportGenerator is not provisioned; run runner-converge" }

      - name: Test the CI preflight dispatcher
        if: steps.changed-files.outputs.run_preflight_tests != 'false'
        shell: bash
        run: bash scripts/ci-preflight.tests.sh

      - name: Test Windows build script
        if: steps.changed-files.outputs.run_build_script != 'false'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-windows.tests.ps1

      - name: Test init.ps1 in process (Pester)
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-init-pester.ps1

      - name: Test optional provisioning and Windows init
        if: steps.changed-files.outputs.run_init != 'false'
        shell: pwsh
        run: dotnet run --project scripts/optional-provisioning/tests/OptionalProvisioning.Tests.csproj -c Release -p:Platform=x64 -- --adapters .

      - name: Test pinned aislop checkout gate
        if: steps.changed-files.outputs.run_aislop_tests != 'false'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci-aislop.tests.ps1

      - name: Test coverage status guard
        if: steps.changed-files.outputs.run_coverage_status != 'false'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-coverage-status.ps1

      - name: Test shared coverage child runner
        if: steps.changed-files.outputs.run_coverage_child != 'false'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-native-coverage-elevated.ps1

      - name: Test offline release guards
        if: steps.changed-files.outputs.run_release_offline != 'false'
        shell: bash
        run: bash scripts/test-release-offline.sh

      - name: Test benchmark report tooling
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/benchmark-report.tests.ps1

      # The native build cache key is computed in the shell for the same reason as the NuGet key below. The key is
      # exact (no restore-keys), so a hit is the binary built from identical native inputs; any other outcome builds.
      - name: Compute the native build cache key
        id: native-key
        continue-on-error: true
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        env:
          CACHE_EPOCH: ${{ vars.CACHE_EPOCH }}
        run: bash scripts/native-build-cache-key.sh windows-release

      # All three native restores rely on closed Gitea sign-up and owner-only writers
      # (including the owner's bots). Revisit before accepting outside pull requests.
      - name: Cache the native build output
        id: native-cache
        continue-on-error: true
        if: steps.changed-files.outputs.skip_build != 'true' && steps.native-key.outcome == 'success' && steps.native-key.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: |
            x64/Release/MFTLibNative.dll
            x64/Release/MFTLibNative.pdb
            x64/Release/MFTLibNative.lib
          key: ${{ steps.native-key.outputs.key }}

      - name: Run coverage
        id: coverage
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          NATIVE_CACHE_HIT: ${{ steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = 'MFTLib.Tests/coverage-run.stdout.log'
          $stderr = 'MFTLib.Tests/coverage-run.stderr.log'
          # Wait for the script's own process only. Start-Process -Wait also waits
          # for every descendant, and the MSBuild reuse nodes the build spawns stay
          # alive for their 15-minute idle timeout, which held this step open long
          # after the tests had passed (PR 251, run 35963). Reading .Handle before
          # the child exits keeps ExitCode readable after WaitForExit.
          $coverageArguments = @('-NoProfile', '-File', 'scripts/run-coverage.ps1', '-NonInteractive')
          if ($env:NATIVE_CACHE_HIT -eq 'true') { $coverageArguments += '-NativeOutputSupplied' }
          $process = Start-Process -FilePath (Get-Command pwsh).Source `
            -ArgumentList $coverageArguments `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -NoNewWindow -PassThru
          $null = $process.Handle
          $finished = $process.WaitForExit([TimeSpan]::FromMinutes(8))
          if (-not $finished) {
            $process.Kill($true)
          }
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if (-not $finished) {
            Write-Host '::error::run-coverage.ps1 did not exit within 8 minutes and was killed.'
            exit 1
          }
          exit $process.ExitCode

      - name: Smoke Windows NuGet native resolution
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke-package-windows.ps1

      - name: Upload coverage artifact
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        # Gitea-native fork: uploads from actions/upload-artifact@v3 never appear in the artifacts REST API that pr-crew reads.
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: windows-coverage
          path: |
            MFTLib.Tests/coverage.xml
            MFTLib.Tests/coverage-report/**
            MFTLib.Tests/coverage-run.stdout.log
            MFTLib.Tests/coverage-run.stderr.log

      - name: Post coverage status
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: pwsh -NoProfile -File scripts/post-coverage-status.ps1

      # Run in this job's original checkout: tracked build/test dirt must survive
      # until the script's first post-clean status observation.
      - name: Verify post-clean initialization (destructive)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci-post-clean-destructive.ps1

  linux:
    if: (github.event_name != 'schedule' || vars.NIGHTLY_CI != 'off')
    runs-on: ubuntu-latest
    env:
      CXX: g++
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Determine changed files (docs-only or pin-only early exit)
        id: changed-files
        shell: bash
        run: bash scripts/ci-changed-files.sh

      # Needs only bash, git and jq, all present on ubuntu-latest, so it runs
      # ahead of the toolchain setup and gives a fast signal on the fan-out
      # script itself. Issue #194: the script reported success while matching
      # no consumer at all, and nothing in CI exercised it.
      - name: Test the consumer sync script
        if: steps.changed-files.outputs.run_sync != 'false'
        run: bash scripts/sync_consumers.tests.sh

      - name: Test the CI preflight dispatcher
        if: steps.changed-files.outputs.run_preflight_tests != 'false'
        run: bash scripts/ci-preflight.tests.sh

      - name: Test the native build cache
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/native-build-cache.tests.sh

      - name: Test the benchmark report workflow
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/benchmark-report-workflow.tests.sh

      - name: Test summary report generator
        if: steps.changed-files.outputs.run_generate_test_report != 'false'
        run: python3 -B tools/test_generate_test_report.py

      - name: Test optional provisioning and Linux init
        if: steps.changed-files.outputs.run_init != 'false'
        shell: bash
        run: |
          dotnet restore scripts/optional-provisioning/tests/OptionalProvisioning.Tests.csproj --locked-mode
          dotnet run --project scripts/optional-provisioning/tests/OptionalProvisioning.Tests.csproj -c Release -p:Platform=x64 --no-restore -- --adapters .

      # The hash is computed in the shell: hashFiles() can evaluate to an empty
      # string on act_runner, which freezes the cache at its first snapshot. CACHE_EPOCH is hashed in too: a raw epoch
      # containing a comma makes the actions/cache key invalid.
      - name: Compute NuGet cache key
        id: nuget-hash
        if: steps.changed-files.outputs.skip_build != 'true'
        env:
          CACHE_EPOCH: ${{ vars.CACHE_EPOCH }}
        run: echo "sha=$({ git ls-files '*.csproj' | sort | xargs sha256sum; printf 'epoch %s\n' "$CACHE_EPOCH"; } | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        if: steps.changed-files.outputs.skip_build != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ steps.nuget-hash.outputs.sha }}
          restore-keys: |
            linux-nuget-

      - name: Verify Linux init Release x64 output
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e MFTLib.Tests/bin/x64/Release/net10.0/MFTLib.Tests.dll
          ./init.sh --build
          test -f MFTLib.Tests/bin/x64/Release/net10.0/MFTLib.Tests.dll
          dotnet test MFTLib.Tests/MFTLib.Tests.csproj -c Release -p:Platform=x64 --no-build --filter 'FullyQualifiedName~AgentInstructionsTests'
          bash scripts/test-agent-instructions.sh

      - name: Compute the native build cache key
        id: native-key
        continue-on-error: true
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        env:
          CACHE_EPOCH: ${{ vars.CACHE_EPOCH }}
        run: bash scripts/native-build-cache-key.sh linux-coverage

      # The coverage build directory restores at this same workspace path (CMake and gcov record absolute paths; the
      # key includes the path). Restored .gcda counters are discarded before testing.
      - name: Cache the native coverage build
        id: native-cache
        continue-on-error: true
        if: steps.changed-files.outputs.skip_build != 'true' && steps.native-key.outcome == 'success' && steps.native-key.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: build/linux-coverage
          key: ${{ steps.native-key.outputs.key }}

      - name: Run coverage
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/coverage-linux.sh ${{ steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit == 'true' && '--native-output-supplied' || '' }}

      - name: Upload coverage artifact
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: linux-coverage
          path: coverage-report/

  # Fast, cheap check that always runs on every PR and push to validate documentation
  # invariants (AgentInstructionsTests character budgets and doc links) without building
  # the native C++ library or running the full test suite.
  docs:
    if: (github.event_name != 'schedule' || vars.NIGHTLY_CI != 'off')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compute NuGet cache key
        id: nuget-hash
        env:
          CACHE_EPOCH: ${{ vars.CACHE_EPOCH }}
        run: echo "sha=$({ git ls-files '*.csproj' | sort | xargs sha256sum; printf 'epoch %s\n' "$CACHE_EPOCH"; } | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ steps.nuget-hash.outputs.sha }}
          restore-keys: |
            linux-nuget-

      - name: Restore, build and run agent instruction tests (managed only)
        run: bash scripts/test-agent-instructions.sh

  # Checks the Release linux-x64 library and packaged MFT dump loading on every pull request.
  # A release rebuilds in WSL from its validated release commit through scripts/build-linux-native.ps1.
  # See [Linux package](../../docs/linux-package.md); the coverage build is never shipped.
  linux-package:
    if: (github.event_name != 'schedule' || vars.NIGHTLY_CI != 'off')
    runs-on: ubuntu-latest
    env:
      CXX: g++
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Determine changed files (docs-only or pin-only early exit)
        id: changed-files
        shell: bash
        run: bash scripts/ci-changed-files.sh

      - name: Test Linux native acceptance checks
        if: steps.changed-files.outputs.run_linux_package_tests != 'false'
        shell: bash
        run: bash scripts/check-linux-native.tests.sh

      - name: Compute the native build cache key
        id: native-key
        continue-on-error: true
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        env:
          CACHE_EPOCH: ${{ vars.CACHE_EPOCH }}
        run: bash scripts/native-build-cache-key.sh linux-release

      - name: Cache the native Release library
        id: native-cache
        continue-on-error: true
        if: steps.changed-files.outputs.skip_build != 'true' && steps.native-key.outcome == 'success' && steps.native-key.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: build/linux/libMFTLibNative.so
          key: ${{ steps.native-key.outputs.key }}

      - name: Build the Release library and run the managed Smoke tier
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/build-linux.sh ${{ steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit == 'true' && '--native-output-supplied' || '' }}

      # Explicit bash with pipefail: the container default is sh -e, which would return tee's status and let a failing check pass.
      - name: Check the library
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-linux-native.sh build/linux/libMFTLibNative.so | tee build/linux/native-check.txt

      - name: Smoke test the package
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/smoke-package-linux.sh build/linux/libMFTLibNative.so

      - name: Upload library artifact
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: linux-native-${{ github.sha }}
          path: |
            build/linux/libMFTLibNative.so
            build/linux/native-check.txt

  report-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject pull request edits to the generated report
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "$PR_BASE"
          git fetch origin "$PR_BASE"
          changed=$(git diff --name-only "$PR_BASE"...HEAD -- TEST-REPORT.md)
          if [ -n "$changed" ]; then
            echo 'TEST-REPORT.md is generated on main by CI and must not be edited in a pull request.' >&2
            exit 1
          fi

  publish-report:
    needs: [windows, linux]
    # Validate the report bot's push in full without publishing another report for it.
    if: >-
      always() && !cancelled() &&
      needs.linux.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && vars.NIGHTLY_CI != 'off') || (github.event_name == 'push' && github.actor != 'test-report-bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.CI_REPORT_TOKEN }}
      - name: Download the Windows coverage artifact
        if: needs.windows.result == 'success'
        # Gitea-native fork, paired with the upload pin: the stock download action cannot read artifacts uploaded by it.
        uses: ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7
        with:
          name: windows-coverage
          path: ${{ runner.temp }}/test-report-windows
      - name: Download the Linux coverage artifact
        uses: ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7
        with:
          name: linux-coverage
          path: ${{ runner.temp }}/test-report-linux
      - name: Generate the summary from the downloaded artifacts
        id: summary
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.CI_REPORT_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          set -euo pipefail
          git fetch origin main
          main_commit=$(git rev-parse FETCH_HEAD)
          if [[ "$main_commit" != "$SOURCE_COMMIT" ]]; then
            echo 'Main advanced; a newer run owns report publication.'
            exit 0
          fi
          run=$(curl -fsS -H "Authorization: token $GITEA_TOKEN" \
            "$SERVER_URL/api/v1/repos/$REPOSITORY/actions/runs/$WORKFLOW_RUN")
          if [[ $(jq -er '.head_sha' <<< "$run") != "$SOURCE_COMMIT" ]]; then
            echo 'Workflow source commit mismatch' >&2
            exit 1
          fi
          generated_at=$(jq -er '.created_at' <<< "$run")
          case "$WINDOWS_RESULT" in
            success) windows_arguments=(--windows-artifact "$RUNNER_TEMP/test-report-windows") ;;
            skipped) windows_arguments=(--windows-skipped) ;;
            *) echo "Unexpected Windows job result: $WINDOWS_RESULT" >&2; exit 1 ;;
          esac
          python3 -B tools/generate_test_report.py "${windows_arguments[@]}" \
            --linux-artifact "$RUNNER_TEMP/test-report-linux" --commit "$SOURCE_COMMIT" \
            --run-id "$WORKFLOW_RUN" --generated-at "$generated_at" --output-path TEST-REPORT.md
          printf 'publish=true\n' >> "$GITHUB_OUTPUT"
      - name: Commit the generated report as test-report-bot
        if: steps.summary.outputs.publish == 'true'
        shell: bash
        env:
          WORKFLOW_RUN: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          git add -- TEST-REPORT.md
          if git diff --cached --quiet -- TEST-REPORT.md; then
            echo 'Report is unchanged.'
            exit 0
          else
            test "$?" -eq 1
          fi
          # The bot's registered address is the server host without its service label.
          host=${SERVER_URL#*://}
          host=${host%%/*}
          host=${host%%:*}
          domain=${host#*.}
          git -c user.name=test-report-bot -c "user.email=test-report-bot@$domain" \
            commit -m "chore: regenerate TEST-REPORT.md from $WORKFLOW_RUN"
          git push origin HEAD:main
