# .gitea/workflows/test.yml
name: test
on:
  push:
    # pr-crew merge train pushes its synthetic batch commit to this branch and polls this run's statuses before landing the batch.
    branches: [main, 'pr-crew/merge-train/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Docs-only and pin-only PRs (.aislop/fork-commit, docs/, or top-level *.md)
      # don't touch anything this job builds or tests.
      # Detect that case and skip the rest of the job's steps (still SUCCESS,
      # not skipped-as-failure, so branch protection's required check is
      # satisfied) instead of paying for a full build+test cycle. Never use
      # workflow-level paths/paths-ignore for this: on Gitea that leaves the
      # required check permanently pending for any PR that doesn't touch the
      # matched paths (gitea issue 36895).
      - name: Determine changed files (docs-only or pin-only early exit)
        id: changed-files
        shell: pwsh
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          bash scripts/ci-changed-files.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSBuild
        if: steps.changed-files.outputs.skip_build != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Select runner-provisioned reportgenerator
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          if (-not $env:SCHOEN_LAB_TOOL_STORE_ROOT) { throw "Runner tool store is not configured" }
          $resolver = Join-Path $env:SCHOEN_LAB_TOOL_STORE_ROOT "resolver/use-tool.ps1"
          & pwsh -NoProfile -File $resolver reportgenerator --add-to-path
          if ($LASTEXITCODE -ne 0) { throw "ReportGenerator is not provisioned; run runner-converge" }

      - name: Test the CI preflight dispatcher
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: bash scripts/ci-preflight.tests.sh

      - name: Test Windows build script
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-windows.tests.ps1

      - name: Test optional provisioning and Windows init
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: dotnet run --project scripts/optional-provisioning/tests/OptionalProvisioning.Tests.csproj -c Release -p:Platform=x64 -- --adapters .

      - name: Test pinned aislop checkout gate
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci-aislop.tests.ps1

      - name: Test coverage status guard
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-coverage-status.ps1

      - name: Test shared coverage child runner
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-native-coverage-elevated.ps1

      - name: Test release package validation
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-release-package-validation.ps1

      - name: Test release notes and publication failure handling
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-release-notes.ps1

      - name: Run coverage
        id: coverage
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = 'MFTLib.Tests/coverage-run.stdout.log'
          $stderr = 'MFTLib.Tests/coverage-run.stderr.log'
          # Wait for the script's own process only. Start-Process -Wait also waits
          # for every descendant, and the MSBuild reuse nodes the build spawns stay
          # alive for their 15-minute idle timeout, which held this step open long
          # after the tests had passed (PR 251, run 35963). Reading .Handle before
          # the child exits keeps ExitCode readable after WaitForExit.
          $process = Start-Process -FilePath (Get-Command pwsh).Source `
            -ArgumentList '-NoProfile', '-File', 'scripts/run-coverage.ps1', '-NonInteractive' `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -NoNewWindow -PassThru
          $null = $process.Handle
          $finished = $process.WaitForExit([TimeSpan]::FromMinutes(8))
          if (-not $finished) {
            $process.Kill($true)
          }
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if (-not $finished) {
            Write-Host '::error::run-coverage.ps1 did not exit within 8 minutes and was killed.'
            exit 1
          }
          exit $process.ExitCode

      - name: Smoke Windows NuGet native resolution
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke-package-windows.ps1

      - name: Upload coverage artifact
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v3
        with:
          name: windows-coverage
          path: |
            MFTLib.Tests/coverage.xml
            MFTLib.Tests/coverage-report/**
            MFTLib.Tests/coverage-run.stdout.log
            MFTLib.Tests/coverage-run.stderr.log

      - name: Post coverage status
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: pwsh -NoProfile -File scripts/post-coverage-status.ps1

      # Genuine, reproducible verification of the post-clean init standard
      # (AGENTS.md "Cleaning the working tree"): git clean -ffxd must be safe
      # to run, and init.ps1/init.bat must restore the checkout from that
      # state, twice (idempotency), through both entry points, including the
      # -Build path. It runs only on the merge to main, never on a pull
      # request or a merge-train push: every step carries the same
      # push-to-main condition (an `if:` on the event, never workflow-level
      # paths, which leave a required check pending on Gitea, issue 36895).
      # The steps stay in THIS job and checkout, after the build and tests,
      # because the first git clean plus the porcelain assertion is what
      # detects a build or test that modified a tracked file (git clean keeps
      # tracked modifications; a fresh checkout would reset them). The git
      # clean only ever discards state this job no longer needs.
      - name: Verify git clean -ffxd leaves a clean tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          git clean -ffxd
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git clean -ffxd exited $LASTEXITCODE."
            exit 1
          }
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git status exited $LASTEXITCODE."
            exit 1
          }
          if ($status) {
            Write-Host "::error::git clean -ffxd left untracked/modified entries behind:"
            Write-Host $status
            exit 1
          }
          Write-Host "git clean -ffxd left a clean tree."

      - name: Run init.ps1 (post-clean restore, first run)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\init.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::init.ps1 (first run) exited $LASTEXITCODE."
            exit 1
          }
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git status exited $LASTEXITCODE."
            exit 1
          }
          if ($status) {
            Write-Host "::error::git status is dirty after init.ps1 (first run):"
            Write-Host $status
            exit 1
          }
          Write-Host "init.ps1 (first run) left a clean tree."

      - name: Run init.ps1 again (idempotency)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\init.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::init.ps1 (second run) exited $LASTEXITCODE."
            exit 1
          }
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git status exited $LASTEXITCODE."
            exit 1
          }
          if ($status) {
            Write-Host "::error::init.ps1 is not idempotent - git status is dirty after a second run:"
            Write-Host $status
            exit 1
          }
          Write-Host "init.ps1 is idempotent: git status is clean after a second run."

      - name: Run init.bat via cmd.exe (documented .\ prefix)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changed-files.outputs.skip_build != 'true'
        shell: cmd
        # NoDefaultCurrentDirectoryInExePath is a per-machine setting (AGENTS.md
        # documents it for the maintainer's own workstation), so this step
        # cannot reproduce the bare-`init.bat` failure that setting causes -
        # it verifies the documented, supported invocation (with the `.\`
        # prefix) actually works through cmd.exe, which is the load-bearing
        # claim: that init.bat correctly forwards to init.ps1.
        run: |
          .\init.bat
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Verify tree is clean after init.bat
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git status exited $LASTEXITCODE."
            exit 1
          }
          if ($status) {
            Write-Host "::error::git status is dirty after init.bat:"
            Write-Host $status
            exit 1
          }
          Write-Host "git status is clean after init.bat."

      - name: Run init.ps1 -Build (native + managed build path)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\init.ps1 -Build
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::init.ps1 -Build exited $LASTEXITCODE."
            exit 1
          }

      - name: Verify tree is clean after the full init path
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git status exited $LASTEXITCODE."
            exit 1
          }
          if ($status) {
            Write-Host "::error::git status is dirty after the full post-clean init verification:"
            Write-Host $status
            exit 1
          }
          Write-Host "git status is clean after the full post-clean init verification."

  linux:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.MFTLIB_CI_IMAGE }}
      options: --ulimit nofile=65536:65536
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Docs-only and pin-only PRs (.aislop/fork-commit, docs/, or top-level *.md)
      # don't touch anything this job builds or tests.
      # Detect that case and skip the rest of the job's steps (still SUCCESS,
      # not skipped-as-failure, so branch protection's required check is
      # satisfied) instead of paying for a full build+test cycle. Never use
      # workflow-level paths/paths-ignore for this: on Gitea that leaves the
      # required check permanently pending for any PR that doesn't touch the
      # matched paths (gitea issue 36895).
      - name: Determine changed files (docs-only or pin-only early exit)
        id: changed-files
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: bash scripts/ci-changed-files.sh

      # Needs only bash, git and jq, all present on ubuntu-latest, so it runs
      # ahead of the toolchain setup and gives a fast signal on the fan-out
      # script itself. Issue #194: the script reported success while matching
      # no consumer at all, and nothing in CI exercised it.
      - name: Test the consumer sync script
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/sync_consumers.tests.sh

      - name: Test the CI preflight dispatcher
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/ci-preflight.tests.sh

      - name: Test optional provisioning and Linux init
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: dotnet run --project scripts/optional-provisioning/tests/OptionalProvisioning.Tests.csproj -c Release -p:Platform=x64 -- --adapters .

      # The hash is computed in the shell: hashFiles() can evaluate to an empty
      # string on act_runner, which freezes the cache at its first snapshot.
      - name: Compute NuGet cache key
        id: nuget-hash
        if: steps.changed-files.outputs.skip_build != 'true'
        run: echo "sha=$(git ls-files '*.csproj' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        if: steps.changed-files.outputs.skip_build != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ steps.nuget-hash.outputs.sha }}-${{ vars.CACHE_EPOCH }}
          restore-keys: |
            linux-nuget-

      - name: Verify Linux init Release x64 output
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e MFTLib.Tests/bin/x64/Release/net10.0/MFTLib.Tests.dll
          ./init.sh --build
          test -f MFTLib.Tests/bin/x64/Release/net10.0/MFTLib.Tests.dll
          dotnet test MFTLib.Tests/MFTLib.Tests.csproj -c Release -p:Platform=x64 --no-build --filter 'FullyQualifiedName~AgentInstructionsTests'
          bash scripts/test-agent-instructions.sh

      - name: Run coverage
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/coverage-linux.sh

      - name: Upload coverage artifact
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v3
        with:
          name: linux-coverage
          path: coverage-report/

  # Fast, cheap check that always runs on every PR and push to validate documentation
  # invariants (AgentInstructionsTests character budgets and doc links) without building
  # the native C++ library or running the full test suite.
  docs:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.MFTLIB_CI_IMAGE }}
      options: --ulimit nofile=65536:65536
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compute NuGet cache key
        id: nuget-hash
        run: echo "sha=$(git ls-files '*.csproj' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ steps.nuget-hash.outputs.sha }}-${{ vars.CACHE_EPOCH }}
          restore-keys: |
            linux-nuget-

      - name: Restore, build and run agent instruction tests (managed only)
        run: bash scripts/test-agent-instructions.sh

  # Builds the Release linux-x64 library the 0.3.0 package ships, runs the acceptance checks on it,
  # and proves a package user on Linux can load an MFT dump with the library resolved from the
  # package. Gitea lists no uploaded artifact over REST, so a release rebuilds the library with
  # scripts/build-linux-native.ps1 on Ubuntu 24.04 under WSL; this job enforces the same checks on
  # every pull request. The coverage build in the linux job above is never shipped.
  linux-package:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.MFTLIB_CI_IMAGE }}
      options: --ulimit nofile=65536:65536
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Determine changed files (docs-only or pin-only early exit)
        id: changed-files
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: bash scripts/ci-changed-files.sh

      - name: Build the Release library and run its smoke test
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/build-linux.sh

      # Explicit bash with pipefail: the container default is sh -e, which would return tee's status and let a failing check pass.
      - name: Check the library
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-linux-native.sh build/linux/libMFTLibNative.so | tee build/linux/native-check.txt

      - name: Smoke test the package
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/smoke-package-linux.sh build/linux/libMFTLibNative.so

      # For a person to download from the run page; the REST artifacts endpoint does not list v3 uploads.
      - name: Upload library artifact
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v3
        with:
          name: linux-native-${{ github.sha }}
          path: |
            build/linux/libMFTLibNative.so
            build/linux/native-check.txt
