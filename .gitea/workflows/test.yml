# .gitea/workflows/test.yml
name: test
on:
  push:
    # pr-crew merge train pushes its synthetic batch commit to this branch and polls this run's statuses before landing the batch.
    branches: [main, 'pr-crew/merge-train/**']
  pull_request:
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      skip_build: ${{ steps.changed-files.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse every maintained script
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-script-syntax.ps1

      - name: Test script syntax gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/script-syntax.tests.ps1

      # Docs-only and pin-only PRs (.aislop/fork-commit, docs/, or top-level *.md)
      # don't touch anything this job builds or tests.
      # Detect that case and skip the rest of the job's steps (still SUCCESS,
      # not skipped-as-failure, so branch protection's required check is
      # satisfied) instead of paying for a full build+test cycle. Never use
      # workflow-level paths/paths-ignore for this: on Gitea that leaves the
      # required check permanently pending for any PR that doesn't touch the
      # matched paths (gitea issue 36895).
      - name: Determine changed files (docs-only or pin-only early exit)
        id: changed-files
        shell: pwsh
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          bash scripts/ci-changed-files.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSBuild
        if: steps.changed-files.outputs.skip_build != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Select runner-provisioned reportgenerator
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          if (-not $env:SCHOEN_LAB_TOOL_STORE_ROOT) { throw "Runner tool store is not configured" }
          $resolver = Join-Path $env:SCHOEN_LAB_TOOL_STORE_ROOT "resolver/use-tool.ps1"
          & pwsh -NoProfile -File $resolver reportgenerator --add-to-path
          if ($LASTEXITCODE -ne 0) { throw "ReportGenerator is not provisioned; run runner-converge" }

      - name: Test the CI preflight dispatcher
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: bash scripts/ci-preflight.tests.sh

      - name: Test Windows build script
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-windows.tests.ps1

      - name: Test optional provisioning and Windows init
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: dotnet run --project scripts/optional-provisioning/tests/OptionalProvisioning.Tests.csproj -c Release -p:Platform=x64 -- --adapters .

      - name: Test pinned aislop checkout gate
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci-aislop.tests.ps1

      - name: Test coverage status guard
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-coverage-status.ps1

      - name: Test summary report generator
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/generate-test-report.ps1

      - name: Test shared coverage child runner
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-native-coverage-elevated.ps1

      - name: Test offline release guards
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: bash scripts/test-release-offline.sh

      - name: Run coverage
        id: coverage
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = 'MFTLib.Tests/coverage-run.stdout.log'
          $stderr = 'MFTLib.Tests/coverage-run.stderr.log'
          # Wait for the script's own process only. Start-Process -Wait also waits
          # for every descendant, and the MSBuild reuse nodes the build spawns stay
          # alive for their 15-minute idle timeout, which held this step open long
          # after the tests had passed (PR 251, run 35963). Reading .Handle before
          # the child exits keeps ExitCode readable after WaitForExit.
          $process = Start-Process -FilePath (Get-Command pwsh).Source `
            -ArgumentList '-NoProfile', '-File', 'scripts/run-coverage.ps1', '-NonInteractive' `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -NoNewWindow -PassThru
          $null = $process.Handle
          $finished = $process.WaitForExit([TimeSpan]::FromMinutes(8))
          if (-not $finished) {
            $process.Kill($true)
          }
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if (-not $finished) {
            Write-Host '::error::run-coverage.ps1 did not exit within 8 minutes and was killed.'
            exit 1
          }
          exit $process.ExitCode

      - name: Smoke Windows NuGet native resolution
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke-package-windows.ps1

      - name: Upload coverage artifact
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        # Gitea-native fork: uploads from actions/upload-artifact@v3 never appear in the artifacts REST API that pr-crew reads.
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: windows-coverage
          path: |
            MFTLib.Tests/coverage.xml
            MFTLib.Tests/coverage-report/**
            MFTLib.Tests/coverage-run.stdout.log
            MFTLib.Tests/coverage-run.stderr.log

      - name: Post coverage status
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: pwsh -NoProfile -File scripts/post-coverage-status.ps1

      # Run in this job's original checkout: tracked build/test dirt must survive
      # until the script's first post-clean status observation.
      - name: Verify post-clean initialization (destructive)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changed-files.outputs.skip_build != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci-post-clean-destructive.ps1

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skip_build: ${{ steps.changed-files.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v4

      # Docs-only and pin-only PRs (.aislop/fork-commit, docs/, or top-level *.md)
      # don't touch anything this job builds or tests.
      # Detect that case and skip the rest of the job's steps (still SUCCESS,
      # not skipped-as-failure, so branch protection's required check is
      # satisfied) instead of paying for a full build+test cycle. Never use
      # workflow-level paths/paths-ignore for this: on Gitea that leaves the
      # required check permanently pending for any PR that doesn't touch the
      # matched paths (gitea issue 36895).
      - name: Determine changed files (docs-only or pin-only early exit)
        id: changed-files
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: bash scripts/ci-changed-files.sh

      # Needs only bash, git and jq, all present on ubuntu-latest, so it runs
      # ahead of the toolchain setup and gives a fast signal on the fan-out
      # script itself. Issue #194: the script reported success while matching
      # no consumer at all, and nothing in CI exercised it.
      - name: Test the consumer sync script
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/sync_consumers.tests.sh

      - name: Test the CI preflight dispatcher
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/ci-preflight.tests.sh

      - name: Test optional provisioning and Linux init
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: |
          dotnet restore scripts/optional-provisioning/tests/OptionalProvisioning.Tests.csproj --locked-mode
          dotnet run --project scripts/optional-provisioning/tests/OptionalProvisioning.Tests.csproj -c Release -p:Platform=x64 --no-restore -- --adapters .

      # The hash is computed in the shell: hashFiles() can evaluate to an empty
      # string on act_runner, which freezes the cache at its first snapshot.
      - name: Compute NuGet cache key
        id: nuget-hash
        if: steps.changed-files.outputs.skip_build != 'true'
        run: echo "sha=$(git ls-files '*.csproj' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        if: steps.changed-files.outputs.skip_build != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ steps.nuget-hash.outputs.sha }}-${{ vars.CACHE_EPOCH }}
          restore-keys: |
            linux-nuget-

      - name: Verify Linux init Release x64 output
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e MFTLib.Tests/bin/x64/Release/net10.0/MFTLib.Tests.dll
          ./init.sh --build
          test -f MFTLib.Tests/bin/x64/Release/net10.0/MFTLib.Tests.dll
          dotnet test MFTLib.Tests/MFTLib.Tests.csproj -c Release -p:Platform=x64 --no-build --filter 'FullyQualifiedName~AgentInstructionsTests'
          bash scripts/test-agent-instructions.sh

      - name: Run coverage
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/coverage-linux.sh

      - name: Upload coverage artifact
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: linux-coverage
          path: coverage-report/

  # Fast, cheap check that always runs on every PR and push to validate documentation
  # invariants (AgentInstructionsTests character budgets and doc links) without building
  # the native C++ library or running the full test suite.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compute NuGet cache key
        id: nuget-hash
        run: echo "sha=$(git ls-files '*.csproj' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ steps.nuget-hash.outputs.sha }}-${{ vars.CACHE_EPOCH }}
          restore-keys: |
            linux-nuget-

      - name: Restore, build and run agent instruction tests (managed only)
        run: bash scripts/test-agent-instructions.sh

  # Checks the Release linux-x64 library and packaged MFT dump loading on every pull request.
  # A release rebuilds in WSL from its validated release commit through scripts/build-linux-native.ps1.
  # See [Linux package](../../docs/linux-package.md); the coverage build is never shipped.
  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Determine changed files (docs-only or pin-only early exit)
        id: changed-files
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: bash scripts/ci-changed-files.sh

      - name: Test Linux native acceptance checks
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: bash scripts/check-linux-native.tests.sh

      - name: Build the Release library and run the managed Smoke tier
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/build-linux.sh

      # Explicit bash with pipefail: the container default is sh -e, which would return tee's status and let a failing check pass.
      - name: Check the library
        if: steps.changed-files.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-linux-native.sh build/linux/libMFTLibNative.so | tee build/linux/native-check.txt

      - name: Smoke test the package
        if: steps.changed-files.outputs.skip_build != 'true'
        run: bash scripts/smoke-package-linux.sh build/linux/libMFTLibNative.so

      - name: Upload library artifact
        if: always() && steps.changed-files.outputs.skip_build != 'true'
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: linux-native-${{ github.sha }}
          path: |
            build/linux/libMFTLibNative.so
            build/linux/native-check.txt

  report-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject pull request edits to the generated report
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "$PR_BASE"
          git fetch origin "$PR_BASE"
          changed=$(git diff --name-only "$PR_BASE"...HEAD -- TEST-REPORT.md)
          if [ -n "$changed" ]; then
            echo 'TEST-REPORT.md is generated on main by CI and must not be edited in a pull request.' >&2
            exit 1
          fi

  publish-report:
    needs: [windows, linux]
    # The shared docs-only early exit also suppresses report-only bot pushes.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      needs.windows.outputs.skip_build != 'true' && needs.linux.outputs.skip_build != 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.MFTLIB_SYNC_TOKEN }}
      - name: Download the Windows coverage artifact
        # Gitea-native fork, paired with the upload pin: the stock download action cannot read artifacts uploaded by it.
        uses: ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7
        with:
          name: windows-coverage
          path: ${{ runner.temp }}/test-report-windows
      - name: Download the Linux coverage artifact
        uses: ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7
        with:
          name: linux-coverage
          path: ${{ runner.temp }}/test-report-linux
      - name: Generate the summary from the downloaded artifacts
        id: summary
        shell: pwsh
        env:
          GITEA_TOKEN: ${{ secrets.MFTLIB_SYNC_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect main before publication' }
          $mainCommit = git rev-parse FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve main' }
          if ($mainCommit -ne $env:SOURCE_COMMIT) {
            Write-Host 'Main advanced; a newer run owns report publication.'
            exit 0
          }
          $headers = @{ Authorization = "token $env:GITEA_TOKEN" }
          $api = "$env:SERVER_URL/api/v1/repos/$env:REPOSITORY"
          $run = Invoke-RestMethod "$api/actions/runs/$env:WORKFLOW_RUN" -Headers $headers
          if ($run.head_sha -ne $env:SOURCE_COMMIT) { throw 'Workflow source commit mismatch' }
          $roots = @{}
          foreach ($platform in @('windows', 'linux')) {
            $directory = Join-Path $env:RUNNER_TEMP "test-report-$platform"
            $markers = @(Get-ChildItem $directory -Recurse -Filter commit.txt)
            if ($markers.Count -ne 1 -or (Get-Content $markers[0].FullName -Raw).Trim() -ne $env:SOURCE_COMMIT) {
              throw "$platform artifact source commit mismatch"
            }
            $roots[$platform] = $markers[0].Directory.FullName
          }
          $timestamp = ([DateTimeOffset]$run.created_at).ToUniversalTime().ToString('o')
          $arguments = @{
            WindowsTrx = @(Join-Path $roots.windows 'non-admin.trx')
            WindowsCobertura = @(Join-Path (Split-Path $roots.windows -Parent) 'coverage.xml')
            LinuxTrx = @(Join-Path $roots.linux 'managed.trx')
            LinuxCobertura = @(Join-Path $roots.linux 'managed/coverage.cobertura.xml')
            Commit = $env:SOURCE_COMMIT; RunId = $env:WORKFLOW_RUN
            GeneratedAt = $timestamp
          }
          $native = Join-Path $roots.linux 'summary.txt'
          if (Test-Path -LiteralPath $native) { $arguments.LinuxNativeSummary = $native }
          & ./scripts/generate-test-report.ps1 @arguments
          'publish=true' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Commit the generated report as the bot
        if: steps.summary.outputs.publish == 'true'
        shell: pwsh
        env:
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- TEST-REPORT.md
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage generated report' }
          git diff --cached --quiet -- TEST-REPORT.md
          if ($LASTEXITCODE -eq 0) { Write-Host 'Report is unchanged.'; exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Cannot compare generated report' }
          git -c user.name=claude-code -c user.email=claude-code@noreply.local commit -m "chore: regenerate TEST-REPORT.md from $env:WORKFLOW_RUN"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit generated report' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish report; main may have advanced' }
